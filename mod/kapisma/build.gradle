plugins {
	id 'fabric-loom' version "${loom_version}"
}

base { archivesName = 'kapisma' }

repositories {
	maven { url = 'https://maven.nucleoid.xyz/' }
	maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sunucu tarafli kutuphaneler: jar'in icine gomulur, oyunculara mod gerekmez
	compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.27"   // Simple Voice Chat API (sadece derleme; mod sunucuda ayrica kurulur)

	modImplementation include("xyz.nucleoid:fantasy:${project.fantasy_version}")
	modImplementation include("eu.pb4:sgui:${project.sgui_version}")
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
